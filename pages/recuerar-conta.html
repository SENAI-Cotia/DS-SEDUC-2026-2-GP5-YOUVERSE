
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Youverse | Recuperação</title>

    <!-- Fontes do Google -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap">

    <!-- CSS da página -->
    <link rel="stylesheet" href="./CSS/recuperar.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header class="cabecalho">
        <img src="./img/logo-youverse.png" alt="Logo Youverse">

        <a href="#">Minha conta</a>
    </header>

    <!-- Conteúdo principal -->
    <main>

        <section class="recuperacao">

            <!-- Título e apresentação -->
            <div class="introducao">
                <img src="./img/cadeado.svg" alt="Cadeado">

                <h1>Esqueceu sua senha?</h1>

                <p>
                    Vamos ajudar você a recuperar
                    o acesso ao seu universo.
                </p>
            </div>

            <!-- Formulário -->
            <form>

                <label for="email">
                    Digite seu e-mail de cadastro
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seu e-mail@gmail.com"
                >

                <button type="submit">
                    Enviar link de recuperação
                </button>

            </form>

            <!-- Aviso -->
            <div class="aviso">
                <p>Verifique seu e-mail</p>

                <small>
                    Se o endereço estiver cadastrado,
                    você receberá as instruções.
                </small>
            </div>

            <!-- Voltar -->
            <a href="login.html" class="botao-voltar">
                Voltar para o login
            </a>

        </section>

    </main>

    <!-- Rodapé -->
    <footer>
        <p>YOUVERSE - 2026</p>
    </footer>

</body>
</html>
